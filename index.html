<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Groceries</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script defer src="js/script.js"></script>
</head>
<body>
  <div class="container">
    <!-- Masthead -->
    <header class="masthead">
      <img src="img/basket.png" alt="Basket Icon" class="basket-icon" />
      <h1>BUY GROCERIES</h1>
      <p class="tagline">What do you need to buy today?</p>
    </header>

    <!-- Main Content -->
    <main>
      <input type="text" id="itemInput" placeholder="your item here ..." />
      <button id="addItemBtn">ADD TO LIST</button>
      <p class="feedback"></p>
      <ul id="itemList"></ul>
    </main>

    <!-- Footer -->
    <footer>
      <a href="#"><i class="social-icon">G+</i></a>
      <a href="#"><i class="social-icon">in</i></a>
      <a href="#"><i class="social-icon">f</i></a>
    </footer>
  </div>
</body>
</html>
